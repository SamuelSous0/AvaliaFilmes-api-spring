spring.config.import=optional:file:.env[.properties]

spring.application.name=avaliaFilme

# DATABASE
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# FRONTEND
frontend.url.local=${FRONTEND_URL_LOCAL}
frontend.url.prod=${FRONTEND_URL_PROD}
frontend.url.prod2=${FRONTEND_URL_PROD2}

# SWAGGER
springdoc.swagger-ui.path=/swagger.html

# EMAIL
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM}
app.frontend-url=${FRONTEND_URL_PROD2}